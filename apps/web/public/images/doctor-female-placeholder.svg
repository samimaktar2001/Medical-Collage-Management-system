<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradFemale" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE7F3" />
      <stop offset="100%" stop-color="#E0E7FF" />
    </linearGradient>
    <linearGradient id="skinGradFemale" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFEDD5" />
      <stop offset="100%" stop-color="#FED7AA" />
    </linearGradient>
  </defs>

  <!-- Circular Background -->
  <circle cx="64" cy="64" r="64" fill="url(#bgGradFemale)" />

  <!-- Hair Back -->
  <path d="M36 50 C36 24 92 24 92 50 C92 78 88 92 84 100 L44 100 C40 92 36 78 36 50 Z" fill="#1E293B" />

  <!-- Shoulders / Lab Coat -->
  <path d="M22 128 C22 96 38 84 64 84 C90 84 106 96 106 128 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" />

  <!-- Inner Scrub Top (Clinical Teal) -->
  <polygon points="64,84 50,108 78,108" fill="#0F766E" />
  <polygon points="64,92 56,128 72,128" fill="#0D5E57" />

  <!-- Stethoscope -->
  <path d="M46 82 C44 98 50 110 56 114 C60 118 60 122 60 126" fill="none" stroke="#0F766E" stroke-width="3" stroke-linecap="round" />
  <path d="M82 82 C84 98 78 110 72 114" fill="none" stroke="#0F766E" stroke-width="3" stroke-linecap="round" />
  <circle cx="60" cy="126" r="4.5" fill="#0F766E" stroke="#5EEAD4" stroke-width="2" />

  <!-- Neck -->
  <path d="M54 66 L74 66 L76 86 L52 86 Z" fill="#FED7AA" />

  <!-- Ears & Earrings -->
  <circle cx="39" cy="50" r="6" fill="#FED7AA" />
  <circle cx="89" cy="50" r="6" fill="#FED7AA" />
  <circle cx="39" cy="54" r="1.5" fill="#F59E0B" />
  <circle cx="89" cy="54" r="1.5" fill="#F59E0B" />

  <!-- Face -->
  <circle cx="64" cy="48" r="23" fill="url(#skinGradFemale)" />

  <!-- Front Hair Style -->
  <path d="M40 44 C42 30 62 22 88 34 C88 46 86 52 86 52 C74 40 56 38 40 44 Z" fill="#1E293B" />

  <!-- Eyebrows -->
  <path d="M49 41 Q54 38 59 40" stroke="#334155" stroke-width="2" stroke-linecap="round" fill="none" />
  <path d="M69 40 Q74 38 79 41" stroke="#334155" stroke-width="2" stroke-linecap="round" fill="none" />

  <!-- Eyes -->
  <ellipse cx="54" cy="47" rx="2.5" ry="3.5" fill="#0F172A" />
  <ellipse cx="74" cy="47" rx="2.5" ry="3.5" fill="#0F172A" />
  <!-- Eye highlights -->
  <circle cx="53" cy="46" r="1" fill="#FFFFFF" />
  <circle cx="73" cy="46" r="1" fill="#FFFFFF" />

  <!-- Eyelashes -->
  <path d="M51 45 L49 43" stroke="#0F172A" stroke-width="1.5" stroke-linecap="round" />
  <path d="M77 45 L79 43" stroke="#0F172A" stroke-width="1.5" stroke-linecap="round" />

  <!-- Nose -->
  <path d="M64 49 L62 55 L65 55" stroke="#F97316" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Friendly Smile (Lips) -->
  <path d="M56 60 Q64 67 72 60" stroke="#BE123C" stroke-width="2" stroke-linecap="round" fill="none" />
</svg>
