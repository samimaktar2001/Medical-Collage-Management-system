<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CCFBF1" />
      <stop offset="100%" stop-color="#99F6E4" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFEDD5" />
      <stop offset="100%" stop-color="#FED7AA" />
    </linearGradient>
  </defs>

  <!-- Circular Background -->
  <circle cx="64" cy="64" r="64" fill="url(#bgGrad)" />

  <!-- Shoulders / Doctor Coat -->
  <path d="M22 128 C22 96 38 84 64 84 C90 84 106 96 106 128 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" />

  <!-- Inner Scrub Shirt -->
  <polygon points="64,84 50,108 78,108" fill="#0F766E" />
  <polygon points="64,92 56,128 72,128" fill="#0D5E57" />

  <!-- Doctor Coat Lapels -->
  <path d="M42 88 L54 116 L50 128" fill="none" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round" />
  <path d="M86 88 L74 116 L78 128" fill="none" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round" />

  <!-- Stethoscope -->
  <path d="M46 82 C44 98 50 110 56 114 C60 118 60 122 60 126" fill="none" stroke="#0F766E" stroke-width="3" stroke-linecap="round" />
  <path d="M82 82 C84 98 78 110 72 114" fill="none" stroke="#0F766E" stroke-width="3" stroke-linecap="round" />
  <circle cx="60" cy="126" r="4.5" fill="#0F766E" stroke="#5EEAD4" stroke-width="2" />

  <!-- Neck -->
  <path d="M54 66 L74 66 L76 86 L52 86 Z" fill="#FED7AA" />

  <!-- Ears -->
  <circle cx="39" cy="50" r="7" fill="#FED7AA" />
  <circle cx="89" cy="50" r="7" fill="#FED7AA" />

  <!-- Face -->
  <circle cx="64" cy="48" r="24" fill="url(#skinGrad)" />

  <!-- Hair -->
  <path d="M38 46 C38 22 90 22 90 46 C90 32 82 20 64 20 C46 20 38 32 38 46 Z" fill="#1E293B" />
  <!-- Sideburns -->
  <rect x="38" y="42" width="4" height="12" rx="2" fill="#1E293B" />
  <rect x="86" y="42" width="4" height="12" rx="2" fill="#1E293B" />

  <!-- Eyebrows -->
  <path d="M49 41 Q54 39 59 41" stroke="#334155" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <path d="M69 41 Q74 39 79 41" stroke="#334155" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- Eyes -->
  <ellipse cx="54" cy="48" rx="2.5" ry="3.5" fill="#0F172A" />
  <ellipse cx="74" cy="48" rx="2.5" ry="3.5" fill="#0F172A" />
  <!-- Eye highlights -->
  <circle cx="53" cy="47" r="1" fill="#FFFFFF" />
  <circle cx="73" cy="47" r="1" fill="#FFFFFF" />

  <!-- Nose -->
  <path d="M64 49 L62 55 L66 55" stroke="#F97316" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Friendly Smile -->
  <path d="M56 60 Q64 67 72 60" stroke="#9A3412" stroke-width="2" stroke-linecap="round" fill="none" />
</svg>
