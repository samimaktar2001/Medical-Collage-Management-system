name: medora-development
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: medora
      POSTGRES_USER: medora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a development database password}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U medora -d medora']
      interval: 10s
      retries: 5
  redis:
    image: redis:7.4-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redisdata:/data
volumes:
  pgdata:
  redisdata:
